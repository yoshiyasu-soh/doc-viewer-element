name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: demo の doc-viewer.js が最新か確認
        run: |
          node scripts/copy-to-demo.mjs
          git diff --exit-code demo/doc-viewer.js || (echo "demo/doc-viewer.js が古いです。npm run build:demo を実行してコミットしてください" && exit 1)
