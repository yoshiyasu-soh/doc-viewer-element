<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doc-viewer-element デモ</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 56rem; padding: 1rem; }
      h2 { margin-top: 2.5rem; font-size: 1rem; }
      code { background: #eee; padding: 0 0.25em; }
    </style>
    <script type="module" src="./doc-viewer.js"></script>
  </head>
  <body>
    <h1>doc-viewer-element</h1>

    <h2>1. <code>src</code> に Markdown の URL</h2>
    <doc-viewer id="v-md" src="./sample.md"></doc-viewer>

    <h2>2. <code>src</code> に ZIP の URL(複数ファイル)</h2>
    <doc-viewer id="v-zip" src="./sample.zip"></doc-viewer>

    <h2>3. <code>files</code> プロパティ</h2>
    <doc-viewer id="v-files" initial-tab="code"></doc-viewer>

    <h2>4. <code>fetcher</code> と <code>labels</code>(日本語)、テーマ変数の上書き</h2>
    <doc-viewer id="v-fetcher" style="--docviewer-accent: #f97316; --docviewer-accent-ring: #ea580c"></doc-viewer>

    <script>
      document.getElementById("v-files").files = [
        { path: "hello.md", kind: "markdown", source: "# Hello\n\nThis is set from JavaScript.\n\n## Section\n\nBody text." },
      ];

      const v = document.getElementById("v-fetcher");
      v.labels = {
        tabCode: "コード", tabPreview: "プレビュー", tabSlides: "スライド", search: "検索",
        copy: "コピー", copied: "コピーしました", showFullDocument: "全文を表示", onThisPage: "目次",
      };
      v.fetcher = async () => (await fetch("./sample.zip")).blob();

      for (const el of document.querySelectorAll("doc-viewer")) {
        el.addEventListener("doc-viewer-ready", (e) => console.log("ready", el.id, e.detail));
        el.addEventListener("doc-viewer-warning", (e) => console.log("warning", el.id, e.detail));
        el.addEventListener("doc-viewer-error", (e) => console.log("error", el.id, e.detail));
      }
    </script>
  </body>
</html>
